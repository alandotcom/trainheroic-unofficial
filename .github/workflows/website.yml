name: Deploy website

# The website is served from https://trainheroic-unofficial.com by Cloudflare Workers Builds (see
# packages/website/wrangler.jsonc). This workflow keeps the old GitHub Pages address,
# alandotcom.github.io/trainheroic-unofficial, sending readers there: it publishes the redirect
# page in packages/website/pages-redirect/ as both index.html and 404.html, so every old path
# lands on the same page on the custom domain.

on:
  push:
    branches: [main]
    paths:
      - packages/website/pages-redirect/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage the redirect page
        run: |
          mkdir -p _site
          cp packages/website/pages-redirect/index.html _site/index.html
          cp packages/website/pages-redirect/index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
